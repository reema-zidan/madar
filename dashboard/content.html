<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محتوى الصفحة | لوحة مدار تك</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="dashboard-body">
    <aside class="dashboard-sidebar">
        <div class="dashboard-brand"><img class="dashboard-brand-logo" src="../assets/images/madar-tech-logo.png" alt="مدار تك"><span><small>محرر الموقع</small></span></div>
        <div class="sidebar-label">إعدادات الموقع</div>
        <nav class="dashboard-nav" aria-label="أقسام لوحة تخصيص الموقع">
            <a class="dashboard-nav-link" href="index.html"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span>نظرة عامة</span></a>
            <a class="dashboard-nav-link active" href="content.html" aria-current="page"><i class="fa-solid fa-file-lines" aria-hidden="true"></i><span>محتوى الصفحة</span></a>
            <a class="dashboard-nav-link" href="sections.html"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>الأقسام والعناصر</span></a>
            <a class="dashboard-nav-link" href="appearance.html"><i class="fa-solid fa-palette" aria-hidden="true"></i><span>الألوان والخطوط</span></a>
            <a class="dashboard-nav-link" href="media.html"><i class="fa-solid fa-image" aria-hidden="true"></i><span>الصور والوسائط</span></a>
        </nav>
        <div class="sidebar-site"><span class="site-status-dot" aria-hidden="true"></span><span><strong>موقع مدار تك</strong><small>محرر المحتوى</small></span></div>
    </aside>
    <main class="dashboard-main">
        <header class="dashboard-topbar"><div><span class="eyebrow">إدارة النصوص</span><h1 class="page-title">محتوى الصفحة</h1></div><a class="draft-label text-decoration-none" href="../index.html" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i> معاينة الموقع</a></header>
        <section class="workspace-panel">
            <form id="contentWorkspace">
                <div class="workspace-grid">
                    <label class="workspace-field">النص فوق عنوان المقدمة<input name="heroEyebrow" type="text"></label>
                    <label class="workspace-field">عنوان المقدمة<input name="heroTitle" type="text"></label>
                    <label class="workspace-field" style="grid-column:1/-1">وصف المقدمة<textarea name="heroDescription"></textarea></label>
                    <label class="workspace-field">عنوان «من نحن»<input name="aboutTitle" type="text"></label>
                    <label class="workspace-field" style="grid-column:span 2">نبذة المؤسسة<textarea name="aboutDescription"></textarea></label>
                    <label class="workspace-field" style="grid-column:1/-1">الرؤية<textarea name="vision"></textarea></label>
                    <label class="workspace-field" style="grid-column:1/-1">الرسالة<textarea name="mission"></textarea></label>
                    <label class="workspace-field">عنوان الخدمات<input name="servicesTitle" type="text"></label>
                    <label class="workspace-field">عنوان البرامج<input name="programsTitle" type="text"></label>
                    <label class="workspace-field">عنوان طريقة عملنا<input name="workTitle" type="text"></label>
                    <label class="workspace-field">عنوان لماذا مدار تك<input name="whyTitle" type="text"></label>
                    <label class="workspace-field">عنوان البرنامج الأول<input name="program1Title" type="text"></label>
                    <label class="workspace-field" style="grid-column:span 2">وصف البرنامج الأول<textarea name="program1Description"></textarea></label>
                    <label class="workspace-field">عنوان البرنامج الثاني<input name="program2Title" type="text"></label>
                    <label class="workspace-field" style="grid-column:span 2">وصف البرنامج الثاني<textarea name="program2Description"></textarea></label>
                    <label class="workspace-field">عنوان البرنامج الثالث<input name="program3Title" type="text"></label>
                    <label class="workspace-field" style="grid-column:span 2">وصف البرنامج الثالث<textarea name="program3Description"></textarea></label>
                    <label class="workspace-field">العنوان في التذييل<input name="footerAddress" type="text"></label>
                    <label class="workspace-field">البريد الإلكتروني<input name="footerEmail" type="email"></label>
                </div>
                <div class="workspace-actions"><button class="workspace-save" type="submit"><i class="fa-solid fa-floppy-disk ms-1" aria-hidden="true"></i>حفظ محتوى الصفحة</button><a class="workspace-link" href="index.html">العودة إلى النظرة العامة</a></div>
                <p id="workspaceStatus" class="workspace-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="../assets/js/script.js"></script>
    <script src="assets/js/dashboard-workspaces.js"></script>
</body>
</html>
