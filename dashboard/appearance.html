<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الألوان والخطوط | لوحة مدار تك</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="dashboard-body">
    <aside class="dashboard-sidebar">
        <div class="dashboard-brand"><img class="dashboard-brand-logo" src="../assets/images/madar-tech-logo.png" alt="مدار تك"><span><small>محرر الموقع</small></span></div>
        <div class="sidebar-label">إعدادات الموقع</div>
        <nav class="dashboard-nav" aria-label="أقسام لوحة تخصيص الموقع">
            <a class="dashboard-nav-link" href="index.html"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span>نظرة عامة</span></a>
            <a class="dashboard-nav-link" href="content.html"><i class="fa-solid fa-file-lines" aria-hidden="true"></i><span>محتوى الصفحة</span></a>
            <a class="dashboard-nav-link" href="sections.html"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>الأقسام والعناصر</span></a>
            <a class="dashboard-nav-link active" href="appearance.html" aria-current="page"><i class="fa-solid fa-palette" aria-hidden="true"></i><span>الألوان والخطوط</span></a>
            <a class="dashboard-nav-link" href="media.html"><i class="fa-solid fa-image" aria-hidden="true"></i><span>الصور والوسائط</span></a>
        </nav>
        <div class="sidebar-site"><span class="site-status-dot" aria-hidden="true"></span><span><strong>موقع مدار تك</strong><small>الهوية البصرية</small></span></div>
    </aside>
    <main class="dashboard-main">
        <header class="dashboard-topbar"><div><span class="eyebrow">الهوية البصرية</span><h1 class="page-title">الألوان والخطوط</h1></div><a class="draft-label text-decoration-none" href="../index.html" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i> معاينة الموقع</a></header>
        <section class="workspace-panel">
            <form id="appearanceWorkspace">
                <div class="workspace-grid">
                    <label class="workspace-field">اللون الأساسي
                        <input name="primaryColor" type="color" value="#03213D">
                    </label>
                    <label class="workspace-field">لون التمييز
                        <input name="accentColor" type="color" value="#D5E159">
                    </label>
                    <label class="workspace-field">لون الخلفيات
                        <input name="backgroundColor" type="color" value="#DAD9D9">
                    </label>
                    <label class="workspace-field">نمط الخط
                        <select name="fontFamily">
                            <option value="'Segoe UI', Tahoma, sans-serif">Segoe UI</option>
                            <option value="Tahoma, Arial, sans-serif">Tahoma</option>
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="'Noto Kufi Arabic', sans-serif">Noto Kufi Arabic</option>
                        </select>
                    </label>
                </div>
                <div class="workspace-actions"><button class="workspace-save" type="submit"><i class="fa-solid fa-floppy-disk ms-1" aria-hidden="true"></i>حفظ الألوان والخط</button><a class="workspace-link" href="index.html">العودة إلى النظرة العامة</a></div>
                <p id="workspaceStatus" class="workspace-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="../assets/js/script.js"></script>
    <script src="assets/js/dashboard-workspaces.js"></script>
</body>
</html>
